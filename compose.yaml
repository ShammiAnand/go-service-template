# Local stack. DEV ONLY: credentials here are throwaway defaults.
#   make up      build and start everything, wait until healthy
#   make token   get an access token for user dev/dev
# UIs: API docs http://localhost:8080/docs | Keycloak http://localhost:8081 (admin/admin)
#      Mailpit http://localhost:8025 | Jaeger http://localhost:16686

x-app-env: &app-env
  APP_ENV: development
  LOG_LEVEL: debug
  DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  AUTH_ISSUER_URL: http://localhost:8081/realms/app
  AUTH_JWKS_URL: http://keycloak:8080/realms/app/protocol/openid-connect/certs
  AUTH_AUDIENCE: api
  EMAIL_DRIVER: smtp
  EMAIL_FROM: no-reply@example.com
  EMAIL_SMTP_HOST: mailpit
  EMAIL_SMTP_PORT: "1025"
  EMAIL_SMTP_TLS: none
  JOBS_DRIVER: asynq
  OBSERVABILITY_DRIVER: otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  HTTP_CORS_ORIGINS: http://localhost:3000

services:
  api:
    build: .
    image: go-service-template:dev
    command: ["serve"]
    environment: *app-env
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    image: go-service-template:dev
    command: ["worker"]
    environment: *app-env
    restart: unless-stopped
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  migrate:
    image: go-service-template:dev
    command: ["migrate", "up"]
    environment: *app-env
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.3-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8080"]
    volumes: ["./deploy/keycloak:/opt/keycloak/data/import:ro"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ["1025:1025", "8025:8025"]

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["16686:16686", "4318:4318"]

volumes:
  pgdata:
