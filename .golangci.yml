version: "2"

run:
  build-tags: [integration]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nilerr
    - revive
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx, bodyclose]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ShammiAnand/go-service-template
